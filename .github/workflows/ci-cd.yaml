name: CI/CD - Build, Test, Push to ECR, Deploy to EC2

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------
  # STAGE 1 + 2 + 3: Checkout, install dependencies, run tests
  # ---------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -v

  # ---------------------------------------------------------------------
  # STAGE 4 + 5: Build Docker image (tagged with commit SHA) and push to ECR
  # ---------------------------------------------------------------------
  build-and-push:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

     
      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # STAGE 6: Deploy to EC2 over SSH, with a health-check verification gate
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR registry URI
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy container over SSH and verify /health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            REGION="${{ env.AWS_REGION }}"
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            REPO="${{ env.ECR_REPOSITORY }}"
            TAG="${{ env.IMAGE_TAG }}"
            IMAGE_URI="$REGISTRY/$REPO:$TAG"
            CONTAINER_NAME="flask-cicd-demo"
            APP_PORT=5000
            MONGO_URI="${{ secrets.MONGO_URI }}"

            echo "Authenticating to ECR..."
            aws ecr get-login-password --region "$REGION" | \
              sudo docker login --username AWS --password-stdin "$REGISTRY"

            echo "Pulling image: $IMAGE_URI"
            sudo docker pull "$IMAGE_URI"

            echo "Stopping and removing existing container (if any)..."
            sudo docker stop "$CONTAINER_NAME" 2>/dev/null || true
            sudo docker rm "$CONTAINER_NAME" 2>/dev/null || true

            echo "Starting new container..."
            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p ${APP_PORT}:${APP_PORT} \
              -e APP_VERSION="$TAG" \
              -e MONGO_URI="$MONGO_URI" \
              "$IMAGE_URI"

            echo "Waiting for container to become healthy..."
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:${APP_PORT}/health" > /dev/null; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i failed, retrying in 3s..."
              sleep 3
            done

            echo "Health check FAILED after retries. Deployment considered failed."
            echo "--- Container logs ---"
            sudo docker logs "$CONTAINER_NAME" || true
            exit 1

  # ---------------------------------------------------------------------
  # STAGE 7: Notify - outcome-aware email with real build details
  # ---------------------------------------------------------------------
  notify:
    name: Notify
    needs: [ test, build-and-push, deploy ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine outcome and failed stage
        id: outcome
        run: |
          TEST_RESULT="${{ needs.test.result }}"
          BUILD_RESULT="${{ needs.build-and-push.result }}"
          DEPLOY_RESULT="${{ needs.deploy.result }}"

          if [ "$TEST_RESULT" != "success" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "failed_stage=Test" >> "$GITHUB_OUTPUT"
          elif [ "$BUILD_RESULT" != "success" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "failed_stage=Build/Push to ECR" >> "$GITHUB_OUTPUT"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "failed_stage=Deploy to EC2" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "failed_stage=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Send SUCCESS email
        if: steps.outcome.outputs.status == 'success'
        uses: dawidd6/action-send-mail@v13
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ SUCCESS: Deployment of ${{ github.repository }} (${{ github.sha }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CI/CD Pipeline <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Deployment succeeded.

            Repository:   ${{ github.repository }}
            Branch:       ${{ github.ref_name }}
            Commit SHA:   ${{ github.sha }}
            Image tag:    ${{ github.sha }}
            ECR image:    ${{ needs.build-and-push.outputs.image_uri }}
            Deploy target: ${{ secrets.EC2_HOST }}

            Pipeline run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The /health endpoint responded successfully after deployment.

      - name: Send FAILURE email
        if: steps.outcome.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v13
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ FAILURE (${{ steps.outcome.outputs.failed_stage }}): ${{ github.repository }} (${{ github.sha }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "CI/CD Pipeline <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Deployment FAILED.

            Failed stage: ${{ steps.outcome.outputs.failed_stage }}
            Repository:   ${{ github.repository }}
            Branch:       ${{ github.ref_name }}
            Commit SHA:   ${{ github.sha }}

            Investigate immediately:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Stage results:
              Test:            ${{ needs.test.result }}
              Build/Push ECR:  ${{ needs.build-and-push.result }}
              Deploy to EC2:   ${{ needs.deploy.result }}